# Start the whole stack:   cp .env.example .env    (first time only)
#                          docker compose up --build
# Stop (keep data):        docker compose down
# Stop and wipe the DB:    docker compose down -v
# Show the final config:   docker compose config   (with all ${VARIABLES} substituted)
#
#   browser ──► frontend (nginx :8080, published on :8081)
#                  │  /api/*
#                  ▼
#               backend (Spring Boot :8080) ──► db (PostgreSQL :5432)
#
# ${VAR:-default}  -> value from .env / shell, or the default
# ${VAR:?message}  -> required: compose refuses to start if it is missing
# $${VAR}          -> a literal $ : evaluated inside the container, not by compose

name: tickets

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tickets}
      POSTGRES_USER: ${POSTGRES_USER:-tickets}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (cp .env.example .env)}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Uncomment to connect with a local DB client (psql, DBeaver, ...) or to run the backend with mvn
    # ports:
    #   - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.multistage
    environment:
      DB_HOST: db # service name = DNS name on the compose network
      DB_NAME: ${POSTGRES_DB:-tickets}
      DB_USER: ${POSTGRES_USER:-tickets}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (cp .env.example .env)}
    depends_on:
      db:
        condition: service_healthy # wait until Postgres accepts connections
    ports:
      - "${BACKEND_PORT:-8080}:8080" # Swagger UI: http://localhost:8080/swagger-ui.html

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.multistage
    environment:
      BACKEND_URL: http://backend:8080 # overrides the ENV default baked into the image
    depends_on:
      backend:
        condition: service_healthy # uses the HEALTHCHECK from the backend image
    ports:
      - "${FRONTEND_PORT:-8081}:8080" # UI: http://localhost:8081

volumes:
  db-data:
