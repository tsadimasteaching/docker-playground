# Same stack as compose.yaml, but the database password is passed as a
# Compose SECRET (a file mounted at /run/secrets/...) instead of an
# environment variable. See README section 5 "Secrets".
#
# First time only:
#   mkdir -p secrets
#   printf '%s' 'a-long-random-password' > secrets/db_password.txt
#
# Start:   docker compose -f compose.secrets.yaml up --build
# Check:   docker compose -f compose.secrets.yaml exec backend cat /run/secrets/DB_PASSWORD
#          docker inspect tickets-backend-1 --format '{{json .Config.Env}}'   (no password!)

name: tickets

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tickets}
      POSTGRES_USER: ${POSTGRES_USER:-tickets}
      # The official postgres image reads the password from this file.
      # Do NOT also set POSTGRES_PASSWORD: the two are mutually exclusive.
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password # short syntax -> /run/secrets/db_password
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.multistage
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB:-tickets}
      DB_USER: ${POSTGRES_USER:-tickets}
      # Spring Boot "configtree": every file in /run/secrets/ becomes a property
      # named after the file. The file DB_PASSWORD fills ${DB_PASSWORD} in
      # application.properties, exactly like the environment variable did.
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
    secrets:
      - source: db_password # long syntax: same secret ...
        target: DB_PASSWORD #   ... mounted as /run/secrets/DB_PASSWORD
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.multistage
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8081}:8080"

# Top-level: where each secret comes from. A service only sees the secrets it
# lists under its own "secrets:" key (the frontend sees none).
secrets:
  db_password:
    file: ./secrets/db_password.txt # in .gitignore, never commit it

volumes:
  db-data:
